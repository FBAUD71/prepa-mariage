<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <title>Prépa Mariage</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">

  <script>
    const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
    if (isStandalone) {
      window.location.href = "VOTRE_URL_EXEC_APPS_SCRIPT";
    }
  </script>
</head>
<body style="font-family: -apple-system, sans-serif; text-align: center; padding: 40px 20px; background-color: #f8fafc; color: #334155;">
  <div style="max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
    
    <!-- ICÔNE VECTORIELLE PAR DÉFAUT SI L'IMAGE BUG (Des alliances stylisées) -->
    <div style="width: 80px; height: 80px; margin: 0 auto 20px auto; background: #eff6ff; border-radius: 20px; display: flex; align-items: center; justify-content: center;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="12" r="6"/>

    <h2 style="font-size: 1.25rem; margin-bottom: 10px;">Parcours Préparation au Mariage</h2>
    <p style="font-size: 0.9rem; color: #64748b; margin-bottom: 25px;">Redirection vers l'application...</p>
    
    <a href="VOTRE_URL_EXEC_APPS_SCRIPT" style="display: inline-block; background-color: #2563eb; color: white; text-decoration: none; padding: 12px 24px; border-radius: 10px; font-weight: bold; font-size: 0.95rem;">
      Accéder directement

  </div>

  <script>
    setTimeout(function() {
      window.location.href = "VOTRE_URL_EXEC_APPS_SCRIPT";
    }, 2000);
